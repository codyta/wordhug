version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised version
    # is usually caught and pulled before it reaches this repo.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      # tsup 9 builds the .d.ts files with TypeScript's compiler API, which
      # TypeScript 7 removed. Stay on 6 until tsup supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Keep Node types in line with the Node versions CI tests (see ci.yml).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
